<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/jpeg" href="E09EB739-7DA5-43EE-AA6D-868C79A0F082_1_105_c.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalaam — System Design</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0f1117;
  --surface: #1a1f2e;
  --border: #2a3045;
  --green: #10b981;
  --text: #f1f5f9;
  --muted: #64748b;
  --indigo: #6366f1;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  line-height: 1.7;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 40px;
  background: rgba(15,17,23,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.back-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  color: var(--muted);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color 0.2s;
}
.back-link:hover { color: var(--green); }

.doc-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: #10b981;
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.25);
  padding: 4px 12px;
  border-radius: 20px;
}

main {
  max-width: 860px;
  margin: 0 auto;
  padding: 48px 32px 96px;
}

#content h1 {
  font-size: 2rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.3;
}

#content h2 {
  font-size: 1.35rem;
  font-weight: 600;
  color: var(--text);
  margin-top: 48px;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

#content h3 {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--green);
  margin-top: 28px;
  margin-bottom: 10px;
}

#content h4 {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--muted);
  margin-top: 20px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

#content p {
  color: #cbd5e1;
  margin-bottom: 14px;
  font-size: 0.95rem;
}

#content strong { color: var(--text); }

#content a { color: var(--green); text-decoration: none; }
#content a:hover { text-decoration: underline; }

#content ul, #content ol {
  padding-left: 24px;
  margin-bottom: 14px;
}

#content li {
  color: #cbd5e1;
  font-size: 0.95rem;
  margin-bottom: 6px;
}

#content pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px 24px;
  overflow-x: auto;
  margin: 20px 0;
}

#content code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  color: #a5f3d0;
}

#content p code, #content li code {
  background: rgba(16,185,129,0.08);
  border: 1px solid rgba(16,185,129,0.15);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.82rem;
  color: #6ee7b7;
}

#content blockquote {
  border-left: 3px solid var(--green);
  padding: 12px 20px;
  margin: 20px 0;
  background: rgba(16,185,129,0.05);
  border-radius: 0 6px 6px 0;
  color: var(--muted);
  font-style: italic;
}

#content table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 0.88rem;
}

#content th {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  padding: 10px 16px;
  text-align: left;
  border: 1px solid var(--border);
}

#content td {
  padding: 9px 16px;
  border: 1px solid var(--border);
  color: #cbd5e1;
  vertical-align: top;
}

#content tr:nth-child(even) td { background: rgba(26,31,46,0.4); }

hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 36px 0;
}

.loading {
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  padding: 80px 0;
  text-align: center;
}

@media (max-width: 640px) {
  header { padding: 14px 20px; }
  main { padding: 32px 20px 64px; }
  #content h1 { font-size: 1.5rem; }
  #content h2 { font-size: 1.15rem; }
  #content pre { font-size: 0.75rem; padding: 14px; }
  #content table { font-size: 0.78rem; }
  #content th, #content td { padding: 7px 10px; }
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-link" onclick="if(history.length&lt;=1){return true;}window.close();return false;">← Back to Portfolio</a>
  <span class="doc-badge">System Design</span>
</header>

<main>
  <div id="content"><div class="loading">Loading document…</div></div>
</main>

<script>
fetch('kalaam_design.md')
  .then(r => r.text())
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
  })
  .catch(() => {
    document.getElementById('content').innerHTML = '<p style="color:#ef4444">Failed to load document.</p>';
  });
</script>
</body>
</html>
